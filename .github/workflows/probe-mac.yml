name: Test des Mac GitHub (temporaire)
on:
  push:
    paths: [".github/workflows/probe-mac.yml"]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14, macos-15, macos-26, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m && which hdiutil tiffutil
