# Publie SÜRPRIZ HÜB dès que sa version change dans hub/package.json :
# tests et construction (Mac + Windows), release GitHub, annonce dans catalog.json
# (les hubs installés proposent alors « Mettre à jour »), puis lancement des .dmg Mac (hub-dmg.yml).
name: Publier SÜRPRIZ HÜB

on:
  push:
    branches: [main]
    paths: ["hub/package.json", ".github/workflows/hub-release.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hub-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      todo: ${{ steps.v.outputs.todo }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Version à publier
        id: v
        run: |
          V=$(node -p "require('./hub/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "hub-v$V" >/dev/null 2>&1; then
            echo "todo=false" >> "$GITHUB_OUTPUT"; echo "hub-v$V existe déjà : rien à publier."
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"; echo "Publication de hub-v$V"
          fi

      - name: Dépendances
        if: steps.v.outputs.todo == 'true'
        working-directory: hub
        run: npm ci

      - name: Tests
        if: steps.v.outputs.todo == 'true'
        working-directory: hub
        run: |
          node test/installers.test.js
          node test/catalog.test.js
          node test/updater.test.js "$(command -v pwsh)"
          node test/winInstall.test.js "$(command -v pwsh)"
          command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          xvfb-run -a npx electron test/electron-asar.test.js --no-sandbox

      - name: Outil de signature Mac (rcodesign)
        if: steps.v.outputs.todo == 'true'
        run: |
          curl -sSL -o /tmp/rc.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  /tmp/rc.tgz" | sha256sum -c -
          tar xzf /tmp/rc.tgz -C /tmp
          echo "RCODESIGN=/tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign" >> "$GITHUB_ENV"

      - name: Construction Mac + Windows
        if: steps.v.outputs.todo == 'true'
        working-directory: hub
        run: tools/release.sh "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.todo == 'true'
        with:
          name: hub-zips
          path: ${{ runner.temp }}/out/
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.todo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/art

      - name: Release GitHub
        run: |
          shopt -s nullglob
          DMGS=("$RUNNER_TEMP"/art/hub-dmgs/*.dmg)
          {
            printf 'SÜRPRIZ HÜB %s pour Mac (Apple Silicon et Intel) et Windows.\n\n' "$V"
            printf 'Déjà installé ? Le hub propose la mise à jour tout seul.\n\n'
            if [ ${#DMGS[@]} -gt 0 ]; then
              printf '**Première installation sur Mac** : télécharge le .dmg de ton Mac (Apple Silicon = puces M1, M2, M3… ; sinon Intel), ouvre-le et suis les étapes affichées.\n'
              printf 'Sans réglage de sécurité : ouvre Terminal et colle cette ligne :\n\n'
            else
              printf '**Première installation sur Mac** : ouvre Terminal et colle cette ligne (pas de réglage de sécurité à faire) :\n\n'
            fi
            printf '```\ncurl -fsSL https://raw.githubusercontent.com/SURPRIZSTUDIO/surpriz-hub/main/install-mac.sh | bash\n```\n\n'
            printf '**Première installation sur Windows** : télécharge Surpriz-Hub-Windows.zip, décompresse-le et ouvre SURPRIZ HUB.exe : il s’installe tout seul.\n\n'
            printf '_Les fichiers « maj-auto » servent aux mises à jour automatiques du hub : inutile de les télécharger._\n'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "hub-v$V" --target "$GITHUB_SHA" --title "SÜRPRIZ HÜB $V" --notes-file "$RUNNER_TEMP/notes.md" \
            "${DMGS[@]}" "$RUNNER_TEMP"/art/hub-zips/Surpriz-Hub-*.zip

      - name: Annonce dans le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node hub/tools/catalog-hub.js "$RUNNER_TEMP/art/hub-zips/assets.json" catalog.json
            git add catalog.json
            if git diff --cached --quiet; then echo "Catalogue déjà à jour"; break; fi
            git commit -q -m "Catalogue : SÜRPRIZ HÜB $V"
            if git push -q origin HEAD:main; then echo "Catalogue publié"; break; fi
            sleep 5
          done

      - name: Disques d'installation Mac (.dmg)
        run: gh workflow run hub-dmg.yml -f tag="hub-v$V"
