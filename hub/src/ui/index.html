<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>SÜRPRIZ HÜB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="drag side-top"></div>
      <div class="brand">
        <div class="brand-name">SÜRPRIZ <b>HÜB</b></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="lang" role="group" aria-label="Langue">
          <button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="link" id="ig">@surprizstudio</button>
        <div class="net" id="net"></div>
        <div class="ver" id="ver"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="drag main-top"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="scroll" id="view"></div>
    </main>
  </div>

  <template id="mark-tpl"><svg class="mark" viewBox="0 0 617 617" aria-hidden="true"><rect class="mark-bg" width="617" height="617" rx="140"/><path class="mark-fg" transform="translate(201.12 123.40) scale(0.87373)" d="M0 97.3H82.4V297.5C82.4 339.63 101.14 351.3 122.9 351.3C144.66 351.3 163.4 339.63 163.4 297.5V97.3H245.8V302.29C245.8 390.13 183.9 423.7 122.9 423.7C61.9 423.7 0 390.13 0 302.29ZM38 0H107.4V65.8H38Z M138.4 0H207.8V65.8H138.4Z"/></svg></template>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <p class="kicker" id="sheet-kicker"></p>
      <h2 id="sheet-title"></h2>
      <ol class="steps" id="sheet-steps"></ol>
      <div class="sheet-msg" id="sheet-msg"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
